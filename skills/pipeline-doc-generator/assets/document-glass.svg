<svg data-waterline-ui-effects="1" xmlns="http://www.w3.org/2000/svg" class="pf-glass-effects" width="1" height="1" viewBox="0 0 1 1" aria-hidden="true" focusable="false" style="position:fixed;left:-2px;top:-2px;width:1px;height:1px;overflow:hidden;pointer-events:none;opacity:0">
  <defs>
    <filter id="pf-glass-control" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feImage href="data:image/png;base64," x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="control-map"/>
      <feDisplacementMap in="SourceGraphic" in2="control-map" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pf-glass-toolbar" x="-10%" y="-35%" width="120%" height="170%" color-interpolation-filters="sRGB">
      <feImage href="data:image/png;base64," x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="toolbar-map"/>
      <feDisplacementMap in="SourceGraphic" in2="toolbar-map" scale="23" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pf-glass-standard" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="256" height="64" color-interpolation-filters="sRGB">
      <feImage href="data:image/png;base64," x="0" y="0" width="256" height="64" preserveAspectRatio="none" result="standard-map"/>
      <feDisplacementMap in="SourceGraphic" in2="standard-map" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
